<!doctype html>
<!-- Served by CastLink.exe (WebCast.cs) to the iPad's Safari: plays the PC screen and sends
     touches back as mouse and keyboard input. Protocol: see the header of WebCast.cs. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CastLink">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<title>CastLink</title>
<style>
  :root { color-scheme: dark; --accent: #4f8cff; --violet: #7c4dff; --card: rgba(28,28,34,.72); --line: rgba(255,255,255,.09);
    --muted: #a1a1aa; }
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f7; overflow: hidden;
    font: 17px -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; -webkit-font-smoothing: antialiased; }
  /* scrolls when the cards are taller than the screen (iPad in landscape with the setup guide) */
  #login { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: max(28px, env(safe-area-inset-top)) 16px 28px; overflow-y: auto; touch-action: pan-y; box-sizing: border-box;
    background: radial-gradient(900px 520px at 15% -10%, rgba(56,132,255,.38), transparent 70%),
                radial-gradient(800px 600px at 110% 110%, rgba(124,77,255,.34), transparent 70%), #0a0a10; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px; width: min(440px, 100%);
    box-sizing: border-box; box-shadow: 0 20px 60px rgba(0,0,0,.45); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
  .login { text-align: center; margin-top: auto; }
  .login img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 8px 24px rgba(79,140,255,.35); }
  .card h1 { font-size: 26px; margin: 14px 0 4px; font-weight: 700; letter-spacing: -.3px; }
  .card p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
  #code { width: 100%; box-sizing: border-box; font-size: 38px; letter-spacing: 14px; text-indent: 14px; text-align: center; padding: 12px;
    border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.35); color: #fff; outline: none;
    font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; transition: border-color .2s, box-shadow .2s; }
  #code:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,140,255,.25); }
  button.big { margin-top: 16px; width: 100%; font-size: 19px; padding: 15px; border: 0; border-radius: 14px; color: #fff; font-weight: 600;
    background: linear-gradient(135deg, #3884ff, #7c4dff); box-shadow: 0 8px 22px rgba(92,110,255,.35); transition: transform .1s, opacity .2s; }
  button.big:active { transform: scale(.98); }
  button.big:disabled { opacity: .45; box-shadow: none; }
  #msg { min-height: 1.4em; margin-top: 12px; color: #ff9f0a; }
  .hint { font-size: 14px; color: #8e8e93; margin-top: 8px; line-height: 1.5; text-align: left; }
  .gestures { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 4px; text-align: left; font-size: 14px; color: #c7c7cc; }
  .gestures b { color: #fff; font-weight: 600; }
  /* the illustrated setup guide (HTTPS certificate, home-screen app) */
  .guide { width: min(640px, 100%); margin-bottom: auto; }
  .guide h2 { font-size: 20px; margin: 0 0 4px; }
  .guide > p { color: var(--muted); margin: 0 0 18px; font-size: 15px; line-height: 1.45; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
  .step .n { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; font-weight: 700; font-size: 15px;
    background: linear-gradient(135deg, #3884ff, #7c4dff); }
  .step .t { font-size: 15px; line-height: 1.5; color: #d1d1d6; }
  .step .t b { color: #fff; }
  .step a { color: #79a8ff; font-weight: 600; text-decoration: none; }
  .step a.btn { display: inline-block; margin-top: 8px; padding: 9px 16px; border-radius: 10px; color: #fff;
    background: linear-gradient(135deg, #3884ff, #7c4dff); }
  .step svg { display: block; width: 100%; max-width: 360px; height: auto; margin-top: 10px; border-radius: 14px; }
  .note { font-size: 13px; color: #8e8e93; margin-top: 14px; line-height: 1.45; }
  /* exactly the visible area: in a home-screen app on an iPad the page gets 32 px less than the
     screen (inner 778 of 810); 100lvh = 810 pushed the bottom of the picture (the Windows taskbar)
     off the screen */
  #stage { position: fixed; inset: 0; display: none; background: #000; }
  video, #c { width: 100%; height: 100%; object-fit: contain; background: #000; pointer-events: none; display: block; }
  #c { display: none; }
  .glass { background: rgba(28,28,32,.62); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.1); }
  #tools { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; gap: 2px; padding: 5px; border-radius: 30px; opacity: .5; transition: opacity .25s; }
  #tools:active, #tools:hover { opacity: 1; }
  #tools button { width: 46px; height: 46px; border-radius: 23px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
  #tools button:active { background: rgba(255,255,255,.14); }
  #tools svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* bottom left: in full screen Safari puts its own close button in the top-left corner */
  #status { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
    font-size: 15px; padding: 9px 14px; border-radius: 14px; display: none; }
  #banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 16px 22px; border-radius: 16px;
    display: none; text-align: center; font-size: 17px; max-width: 80vw; }
  #kbd { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; }
</style>
</head>
<body>
<div id="login">
  <div class="card login">
    <img src="/icon.png" alt="">
    <h1 id="t-title"></h1>
    <p id="t-intro"></p>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••">
    <button class="big" id="go"></button>
    <div id="msg"></div>
    <div class="gestures" id="t-hint"></div>
  </div>
  <div class="card guide" id="guide" style="display:none"></div>
</div>
<div id="stage">
  <video id="v" muted playsinline autoplay disablepictureinpicture></video>
  <canvas id="c"></canvas>
  <div id="status" class="glass"></div>
  <div id="banner" class="glass"></div>
  <div id="tools" class="glass">
    <button id="b-kbd" aria-label="Keyboard"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.3 10h.01M12.6 10h.01M15.9 10h.01M6 13.5h.01M18 10h.01M18 13.5h.01M9 14.5h6"/></svg></button>
    <button id="b-smooth" aria-label="Smoother"><svg viewBox="0 0 24 24"><path d="M2.5 9.5c2.4-3 4.8-3 7.2 0s4.8 3 7.2 0 3.6-2.2 4.6-1.4M2.5 15.5c2.4-3 4.8-3 7.2 0s4.8 3 7.2 0 3.6-2.2 4.6-1.4"/></svg></button>
    <button id="b-fit" aria-label="Picture size"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="b-info" aria-label="Info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01"/></svg></button>
  </div>
  <textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
</div>
<script>
"use strict";
const LT = (navigator.language || "").toLowerCase().startsWith("lt");
// an iPad says "Macintosh" in its user agent; only the touch screen gives it away
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
// opened from the home screen icon: already full screen, without Safari's bars
const STANDALONE = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
// a computer rather than a tablet: no touch screen, a mouse and a keyboard of its own
const DESKTOP = !IOS && navigator.maxTouchPoints === 0;
const MAC = DESKTOP && /Macintosh/.test(navigator.userAgent);
const T = LT ? {
  title: "CastLink",
  intro: "Įveskite kodą, kurį rodo kompiuterio programa.",
  go: "Jungtis",
  gestures: [["Bakstelėjimas", "spustelėjimas"], ["Tempimas", "tempimas (žymėti, perkelti langą)"],
    ["Palaikymas / 2 pirštai", "dešinysis klavišas"], ["Slinkti 2 pirštais", "pelės ratukas"]],
  mouse: [["Spustelėjimas", "spustelėjimas"], ["Tempimas", "tempimas (žymėti, perkelti langą)"],
    ["Dešinysis / 2 pirštais", "dešinysis klavišas"], ["Slinkimas", "pelės ratukas"],
    ["Klaviatūra", "rašo kompiuteryje (⌘ ir Ctrl kombinacijos lieka šiam kompiuteriui)"]],
  bad: "Neteisingas kodas.",
  noMse: "Ši naršyklė negali rodyti vaizdo (nėra Media Source). Reikia iPadOS 13 ar naujesnės.",
  lost: "Ryšys nutrūko, jungiamasi iš naujo…",
  wait: "Laukiama vaizdo…",
  noControl: "Valdymas išjungtas kompiuteryje",
  fits: { fill: "Užpildyti: per visą ekraną, kraštai nukerpami", stretch: "Ištempti: per visą ekraną, vaizdas ištemptas", contain: "Talpinti: visas vaizdas su juostomis" },
  guide: {
    title: "Vienkartinis iPado nustatymas",
    intro: "Kad iPado ekranas neužgestų ir viskas būtų šifruojama, iPadas turi pasitikėti šio kompiuterio sertifikatu. Tai daroma vieną kartą.",
    s1: "<a href='/ca.cer'>Atsisiųskite sertifikatą</a> ir lange spauskite <b>Leisti</b>.",
    s2: "Atidarykite <b>Nustatymai</b>. Viršuje atsiras <b>Atsisiųstas profilis</b>: bakstelėkite jį.",
    s3: "Prieš diegdami spauskite <b>Daugiau informacijos</b>. <b>SHA-256</b> pradžia turi sutapti su ta, kurią rodo kompiuterio programos langas. Jei nesutampa, nediekite. Tada <b>Įdiegti</b>.",
    s4: "Nustatymai → Bendrieji → Apie → <b>Sertifikatų patikimumo nustatymai</b> → įjunkite <b>TV Cast local CA</b>. Be šio jungiklio Safari rašys „Ryšys nėra privatus“.",
    s5: host => "Atidarykite saugų adresą:<br><a class='btn' href='https://" + host + "/'>https://" + host + "</a>",
    s6: "Per visą ekraną: Safari → <b>Bendrinti</b> → <b>Į pradžios ekraną</b>, tada atidarykite <b>CastLink</b> piktogramą (kodą įveskite dar kartą).",
    note: "Sertifikatas galioja tik vietinio tinklo adresams, ne interneto svetainėms. Paveikslėliai supaprastinti: iPado ekranas gali atrodyti šiek tiek kitaip.",
    homeTitle: "Per visą ekraną",
    allow: "Leisti", ignore: "Ignoruoti", dlAsk: "Svetainė nori atsisiųsti", dlAsk2: "konfigūracijos profilį.",
    settings: "Nustatymai", profile: "Atsisiųstas profilis", more: "Daugiau informacijos", install: "Įdiegti",
    trust: "Sertifikatų patikimumo nustatymai", pc: "= kompiuterio lange", share: "Bendrinti", addHome: "Į pradžios ekraną",
  },
  mac: {
    title: "Vienkartinis „Mac“ nustatymas",
    intro: "Kad viskas būtų šifruojama ir ekranas neužgestų, „Mac“ turi pasitikėti šio kompiuterio sertifikatu. Tai daroma vieną kartą.",
    m1: "<a href='/ca.cer'>Atsisiųskite sertifikatą</a>. Failas <b>ca.cer</b> atsiras aplanke <b>Downloads</b>: dukart spustelėkite jį.",
    m2: "Atsidarys <b>Keychain Access</b>. Pasirinkite raktinę <b>login</b> ir spauskite <b>Add</b>.",
    m3: "Keychain Access sąraše dukart spustelėkite <b>TV Cast local CA</b>. <b>SHA-256</b> pradžia turi sutapti su ta, kurią rodo kompiuterio programos langas. Jei nesutampa, ištrinkite šį sertifikatą.",
    m4: "Skiltyje <b>Trust</b> prie „When using this certificate“ pasirinkite <b>Always Trust</b>, uždarykite langą ir įveskite „Mac“ slaptažodį.",
    m6: "Nebūtina: Safari → <b>File</b> → <b>Add to Dock</b> (macOS 14 ir naujesnė): puslapis atsidarys kaip atskira programa, be Safari juostų.",
    note: "Sertifikatas galioja tik vietinio tinklo adresams, ne interneto svetainėms. Paveikslėliai supaprastinti, meniu pavadinimai juose angliški: lietuviškame macOS jie gali būti išversti.",
    dockTitle: "Kaip atskira programa",
  },
  awake: "ekranas budi",
  sound: "garsas",
  smoothOn: "Sklandžiau: įjungta (vaizdas ir garsas ~0,15 s vėliau, bet be trūkčiojimų)",
  smoothOff: "Sklandžiau: išjungta (mažiausias vėlavimas)",
  smoothShort: "sklandžiau",
  locked: s => "Per daug neteisingų kodų. Bandykite po " + Math.ceil(s / 60) + " min. (kompiuteris rodys naują kodą).",
  noSound: "garsas neateina (kompiuteryje išjungta „Siųsti garsą“?)",
  replaced: "Dabar rodoma kitame įrenginyje ar skirtuke. Spauskite „Jungtis“, kad rodytų čia.",
} : {
  title: "CastLink",
  intro: "Enter the code shown by the PC app.",
  go: "Connect",
  gestures: [["Tap", "click"], ["Drag", "drag (select, move windows)"], ["Long press / 2 fingers", "right click"], ["2-finger swipe", "scroll wheel"]],
  mouse: [["Click", "click"], ["Drag", "drag (select, move windows)"], ["Right / 2-finger click", "right click"], ["Scroll", "scroll wheel"],
    ["Keyboard", "types on the PC (⌘ and Ctrl shortcuts stay with this computer)"]],
  bad: "Wrong code.",
  noMse: "This browser cannot play the stream (no Media Source). iPadOS 13 or newer is needed.",
  lost: "Connection lost, reconnecting…",
  wait: "Waiting for the picture…",
  noControl: "Control is turned off on the PC",
  fits: { fill: "Fill: whole screen, edges cut off", stretch: "Stretch: whole screen, picture stretched", contain: "Fit: whole picture, with bars" },
  guide: {
    title: "One-time iPad setup",
    intro: "To keep the iPad screen on and encrypt everything, the iPad has to trust this PC's certificate. You do this once.",
    s1: "<a href='/ca.cer'>Download the certificate</a> and tap <b>Allow</b>.",
    s2: "Open <b>Settings</b>. <b>Profile Downloaded</b> appears at the top: tap it.",
    s3: "Before installing tap <b>More Details</b>. The start of the <b>SHA-256</b> must match the one the PC app window shows. If it does not, do not install. Then <b>Install</b>.",
    s4: "Settings → General → About → <b>Certificate Trust Settings</b> → turn on <b>TV Cast local CA</b>. Without this switch Safari says “This Connection Is Not Private”.",
    s5: host => "Open the secure address:<br><a class='btn' href='https://" + host + "/'>https://" + host + "</a>",
    s6: "Full screen: Safari → <b>Share</b> → <b>Add to Home Screen</b>, then open the <b>CastLink</b> icon (type the code once more).",
    note: "The certificate is only valid for local network addresses, not for websites. The pictures are simplified: your iPad may look a little different.",
    homeTitle: "Full screen",
    allow: "Allow", ignore: "Ignore", dlAsk: "This website is trying to download", dlAsk2: "a configuration profile.",
    settings: "Settings", profile: "Profile Downloaded", more: "More Details", install: "Install",
    trust: "Certificate Trust Settings", pc: "= in the PC window", share: "Share", addHome: "Add to Home Screen",
  },
  mac: {
    title: "One-time Mac setup",
    intro: "To encrypt everything and keep the screen on, the Mac has to trust this PC's certificate. You do this once.",
    m1: "<a href='/ca.cer'>Download the certificate</a>. The file <b>ca.cer</b> appears in <b>Downloads</b>: double-click it.",
    m2: "<b>Keychain Access</b> opens. Choose the <b>login</b> keychain and click <b>Add</b>.",
    m3: "In Keychain Access double-click <b>TV Cast local CA</b>. The start of the <b>SHA-256</b> must match the one the PC app window shows. If it does not, delete this certificate.",
    m4: "Under <b>Trust</b>, set “When using this certificate” to <b>Always Trust</b>, close the window and enter the Mac's password.",
    m6: "Optional: Safari → <b>File</b> → <b>Add to Dock</b> (macOS 14 and later): the page opens as an app of its own, without Safari's bars.",
    note: "The certificate is only valid for local network addresses, not for websites. The pictures are simplified.",
    dockTitle: "As an app of its own",
  },
  awake: "screen kept on",
  sound: "sound",
  smoothOn: "Smoother: on (picture and sound ~0.15 s later, without stutter)",
  smoothOff: "Smoother: off (least delay)",
  smoothShort: "smoother",
  locked: s => "Too many wrong codes. Try again in " + Math.ceil(s / 60) + " min (the PC will show a new code).",
  noSound: "no sound arriving (is “Send sound” off on the PC?)",
  replaced: "Now showing on another device or tab. Press “Connect” to show it here.",
};
const $ = id => document.getElementById(id);
$("t-title").textContent = T.title; $("t-intro").textContent = T.intro; $("go").textContent = T.go;
$("t-hint").innerHTML = (DESKTOP ? T.mouse : T.gestures).map(g => "<b>" + g[0] + "</b><span>" + g[1] + "</span>").join(""); document.title = T.title;

// ---- the illustrated setup guide: simplified drawings of the iPad screens ------------------
const G = T.guide;
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
function svg(h, body) {
  return "<svg viewBox='0 0 360 " + h + "' font-family='-apple-system,Segoe UI,sans-serif'>"
    + "<rect width='360' height='" + h + "' rx='14' fill='#1c1c1e'/>" + body + "</svg>";
}
const txt = (x, y, t, o) => "<text x='" + x + "' y='" + y + "' fill='" + ((o && o.c) || "#f2f2f7") + "' font-size='" + ((o && o.s) || 14)
  + "'" + (o && o.b ? " font-weight='600'" : "") + (o && o.a ? " text-anchor='" + o.a + "'" : "") + ">" + esc(t) + "</text>";
const ring = (x, y, w, h, r) => "<rect x='" + x + "' y='" + y + "' width='" + w + "' height='" + h + "' rx='" + r
  + "' fill='none' stroke='#4f8cff' stroke-width='2.5'/>";
const row = (y, label, o) => "<rect x='16' y='" + y + "' width='328' height='40' rx='10' fill='#2c2c2e'/>"
  + (o && o.icon ? o.icon : "") + txt(o && o.icon ? 58 : 30, y + 25, label, { b: o && o.b, c: o && o.c })
  + (o && o.chev !== false ? "<path d='M326 " + (y + 14) + "l6 6-6 6' stroke='#636366' stroke-width='2' fill='none'/>" : "");
const SHOTS = {
  // Safari asks before downloading the profile
  s1: svg(150, "<rect x='60' y='16' width='240' height='118' rx='14' fill='#2c2c2e'/>"
    + txt(180, 46, G.dlAsk, { a: "middle", s: 13 }) + txt(180, 64, G.dlAsk2, { a: "middle", s: 13 })
    + "<path d='M60 88h240M180 88v46' stroke='#48484a'/>"
    + txt(120, 117, G.ignore, { a: "middle", c: "#4f8cff" }) + txt(240, 117, G.allow, { a: "middle", c: "#4f8cff", b: true })
    + ring(186, 94, 108, 36, 10)),
  // the Settings sidebar with the new entry at the top
  s2: svg(164, txt(20, 34, G.settings, { s: 22, b: true })
    + "<rect x='16' y='48' width='328' height='48' rx='10' fill='#2c2c2e'/><circle cx='42' cy='72' r='15' fill='#636366'/>"
    + "<rect x='66' y='62' width='120' height='8' rx='4' fill='#636366'/><rect x='66' y='76' width='80' height='6' rx='3' fill='#48484a'/>"
    + row(108, G.profile, { b: true }) + ring(14, 106, 332, 44, 11)),
  // the profile screen: More Details and the SHA-256 to compare
  s3: svg(176, row(16, "TV Cast local CA", { b: true, chev: false, icon: "<image href='/icon.png' x='24' y='22' width='28' height='28'/>" })
    + "<text x='330' y='41' fill='#4f8cff' font-size='14' font-weight='600' text-anchor='end'>" + esc(G.install) + "</text>"
    + row(66, G.more, { c: "#4f8cff" })
    + txt(24, 134, "SHA-256", { c: "#8e8e93", s: 12 }) + txt(24, 157, "XX XX XX XX XX XX XX XX", { s: 14, b: true })
    + ring(16, 138, 222, 28, 7) + txt(246, 157, G.pc, { c: "#8e8e93", s: 11 })),
  // Certificate Trust Settings with the switch on
  s4: svg(112, txt(20, 34, G.trust, { s: 17, b: true })
    + "<rect x='16' y='52' width='328' height='44' rx='10' fill='#2c2c2e'/>" + txt(30, 79, "TV Cast local CA")
    + "<rect x='284' y='60' width='48' height='28' rx='14' fill='#34c759'/><circle cx='318' cy='74' r='12' fill='#fff'/>"
    + ring(278, 55, 60, 38, 19)),
  // Share -> Add to Home Screen -> the icon on the home screen
  s6: svg(132, "<rect x='16' y='16' width='200' height='100' rx='12' fill='#2c2c2e'/>"
    + txt(30, 42, G.share, { c: "#8e8e93", s: 12 })
    + "<rect x='26' y='56' width='180' height='40' rx='9' fill='#3a3a3c'/>"

  const sa = getComputedStyle(document.documentElement);
  return "inner=" + innerWidth + "x" + innerHeight + " stage=" + st.clientWidth + "x" + st.clientHeight
    + " video=" + Math.round(r.top) + ".." + Math.round(r.bottom) + " src=" + video.videoWidth + "x" + video.videoHeight
    + " vv=" + (vv ? Math.round(vv.width) + "x" + Math.round(vv.height) + "@" + Math.round(vv.offsetTop) : "-")
    + " screen=" + screen.width + "x" + screen.height + " dpr=" + devicePixelRatio
    + " fit=" + fit + " standalone=" + STANDALONE + " safe=" + safeArea();
}
function playerState() {
  const ua = navigator.userAgent.replace(/^Mozilla\/5\.0 /, "").slice(0, 120);
  return "MS=" + (ms ? ms.constructor.name : "-") + " ms.state=" + (ms ? ms.readyState : "-") + " sb=" + (sb ? "yes" : "no")
    + " got=" + received + " appended=" + appended + " pending=" + pending.length
    + " v.ready=" + video.readyState + " v.net=" + video.networkState + " v.err=" + (video.error ? video.error.code : "-")
    + " codec=" + (cfg ? cfg.codec : "-") + " type ok=" + (window.ManagedMediaSource || window.MediaSource).isTypeSupported('video/mp4; codecs="' + (cfg ? cfg.codec : "avc1.640028") + '"')
    + " | " + ua;
}

function pump() {
  if (!sb || sb.updating || !pending.length) return;
  // keep only a few seconds behind the playhead in memory
  const b = sb.buffered;
  if (b.length && video.currentTime - b.start(0) > 10) { sb.remove(0, video.currentTime - 3); return; }
  try { sb.appendBuffer(pending.shift()); appended++; }
  catch (e) { report("appendBuffer: " + e.name + " " + e.message); pending.length = 0; skipToKey = true; send(new Uint8Array([0x11])); }
}

// stay at the live edge: speed up a little when behind, jump when far behind
let tick = 0, fps = 0, seeks = 0, waits = 0, lastLag = -1;
const errors = [];
video.addEventListener("waiting", () => waits++);
setInterval(() => {
  // frames per second over the last second
  if (++tick % 4 === 0) { fps = frames - lastFrames; lastFrames = frames; }
  const b = video.buffered;
  let lag = -1;
  if (b.length) {
    const end = b.end(b.length - 1);
    lag = end - video.currentTime;
    lastLag = lag;
    const k = smooth ? 2 : 1;
    if (lag > 1.5 * k) { video.currentTime = end - 0.15 * k; seeks++; }
    video.playbackRate = lag > 0.4 * k ? 1.15 : lag > 0.2 * k ? 1.05 : 1.0;
    if (video.paused) video.play().catch(() => {});
    if (frames > 0) banner("");
  }
  const st = $("status");
  if (st.style.display === "block") {
    if (rtcOn && tick % 4 === 0) rtcStats();
    st.textContent = (rtcOn ? "WebRTC (UDP)" + (smooth ? " · " + T.smoothShort : "") : fps + " fps · " + (wc ? "WebCodecs" + (smooth ? " · " + T.smoothShort + " " + jitterMs() + " ms" : "") : (lag < 0 ? "–" : Math.round(lag * 1000) + " ms buffer"))) + " · "
      + (cfg ? cfg.w + "×" + cfg.h : "")
      + (rtcOn
        ? " · " + T.sound + " " + (rtcAudio ? (rtcAudio.level !== null ? Math.round(rtcAudio.level * 100) + "% " : "") + "(" + rtcAudio.ms + " ms)" : "–")
          + (rtcAudio && rtcAudio.packets === 0 ? " · " + T.noSound : "")
        : (audioCtx ? " · " + T.sound + " " + Math.round(audioPeak * 100) + "% (" + (audioCtx.state === "running" ? bufferedMs() + " ms" : audioCtx.state) + ")" : " · " + T.sound + " –")
          + (audioMsgs === 0 ? " · " + T.noSound : ""))
      + (wakeLock ? " · " + T.awake : "");
    if (tick % 4 === 0) audioPeak = 0;
  }
}, 250);

document.addEventListener("visibilitychange", () => { if (!document.hidden) send(new Uint8Array([0x11])); });

// ---- sound: 20 ms PCM messages into Web Audio --------------------------------------------

// Safari plays Web Audio as "ambient" sound, which the iPad's silent mode mutes; "playback"
// (iPadOS 16.4+) makes it media sound like a video. Must run inside a tap.
function startAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      try { audioCtx = new AC({ sampleRate: 48000 }); } catch (e) { audioCtx = new AC(); }
      startRing();
    }
    if (audioCtx.state !== "running") audioCtx.resume();
    const silent = audioCtx.createBufferSource(); // a few silent samples "unlock" sound on iOS
    silent.buffer = audioCtx.createBuffer(1, 128, audioCtx.sampleRate);
    silent.connect(audioCtx.destination); silent.start(0);
  } catch (e) {}
}
// iPadOS may suspend the context (another app played sound, the screen was locked): any
// touch brings it back
// WebRTC sound plays in the video element: if Safari started it muted, the next touch unmutes it
["touchend", "mouseup", "keydown"].forEach(t => document.addEventListener(t, () => {
  if (rtcOn && video.muted) { video.muted = false; video.play().catch(() => {}); }
  if (audioCtx && audioCtx.state !== "running") startAudio();
}, true));

let audioPeak = 0, audioMsgs = 0, audioPeak5 = 0;

// every 5 s while watching: the sound state goes to the PC window / log (no console on an iPad)
setInterval(() => {
  if (!started || !ws || ws.readyState !== 1) return;
  const a = audioCtx;
  const q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
  rtcStats();
  ws.send("video: mode=" + (rtcOn ? "webrtc " + rtcInfo : wc ? "webcodecs" : "mse") + " got=" + received + " decoded=" + (wc ? wcDecoded : q ? q.totalVideoFrames : "-")
    + " queue=" + (wc ? wc.decodeQueueSize : "-") + " smooth=" + smooth + (smooth && wc ? " jitter=" + jitterMs() + "ms late=" + jLate : "")
    + " dropped=" + (q ? q.droppedVideoFrames : "-")
    + " lag=" + Math.round(lastLag * 1000) + "ms waits=" + waits + " seeks=" + seeks + " rate=" + video.playbackRate
    + " ready=" + video.readyState + " " + geometry() + " secure=" + window.isSecureContext + " wake=" + (wakeLock ? "on" : ("wakeLock" in navigator ? "off" : "n/a"))
    + (errors.length ? " errors=" + errors.join(" / ") : "")
    + " | sound: msgs=" + audioMsgs + " peak5s=" + Math.round(audioPeak5 * 100) + "%"
    + " ctx=" + (a ? a.state + "@" + a.sampleRate + " t=" + a.currentTime.toFixed(1) + " buffered=" + bufferedMs() + "ms" : "none")
    + " session=" + (navigator.audioSession ? navigator.audioSession.type : "n/a") + " rate=" + (cfg ? cfg.rate : "-"));
  audioPeak5 = 0;
}, 5000);


// Sound plays as one continuous stream: the 20 ms messages go into a ring buffer that a
// ScriptProcessor reads (AudioWorklet needs HTTPS). Separate nodes per message, each
// resampled on its own from 48 kHz to the iPad's 44.1 kHz, clicked at every seam ("tick tick").
// After an underrun (Wi-Fi stall) the sound stays silent until START_MS are buffered again,
// and more than MAX_MS queued is skipped so the sound never drifts behind the picture.
const RING = 1 << 17;
// normal: 80 ms start, at most 300 queued; smooth: about the picture's delay
function startMs() { return smooth ? SMOOTH_MS + 30 : 80; }
function maxMs() { return smooth ? 600 : 300; }
const ringL = new Float32Array(RING), ringR = new Float32Array(RING);
let ringW = 0, ringR0 = 0, ringPlaying = false, ringNode = null, ringStep = 1, ringPos = 0;

function ringFill() { return (ringW - ringR0 + RING) % RING; }
function bufferedMs() { return audioCtx ? Math.round(ringFill() / audioCtx.sampleRate * 1000) : 0; }

function startRing() {
  ringNode = audioCtx.createScriptProcessor(1024, 1, 2);
  ringNode.onaudioprocess = e => {
    const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1), n = L.length;
    const rate = audioCtx.sampleRate;
    if (!ringPlaying && ringFill() >= startMs() * rate / 1000) ringPlaying = true;
    if (ringFill() > maxMs() * rate / 1000) ringR0 = (ringW - Math.round((startMs() + 40) * rate / 1000) + RING) % RING;
    for (let i = 0; i < n; i++) {
      if (ringPlaying && ringFill() > 0) { L[i] = ringL[ringR0]; R[i] = ringR[ringR0]; ringR0 = (ringR0 + 1) % RING; }
      else { L[i] = 0; R[i] = 0; ringPlaying = false; }
    }
  };
  ringNode.connect(audioCtx.destination);
}

function playAudio(buf) {
  if (!audioCtx || !cfg || !ringNode) return;
  const n = (buf.byteLength - 1) >> 2, dv = new DataView(buf, 1);
  // the context may run at another rate than the stream (iPads without 48 kHz): linear resampling
  // that carries its position across messages, so there is no seam
  ringStep = cfg.rate / audioCtx.sampleRate;
  let peak = 0;
  const l = new Float32Array(n), r = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    l[i] = dv.getInt16(i * 4, true) / 32768; r[i] = dv.getInt16(i * 4 + 2, true) / 32768;
    peak = Math.max(peak, Math.abs(l[i]), Math.abs(r[i]));
  }
  if (ringStep === 1) {
    for (let i = 0; i < n; i++) { ringL[ringW] = l[i]; ringR[ringW] = r[i]; ringW = (ringW + 1) % RING; }
  } else {
    for (; ringPos < n - 1; ringPos += ringStep) {
      const i = Math.floor(ringPos), f = ringPos - i;
      ringL[ringW] = l[i] + (l[i + 1] - l[i]) * f; ringR[ringW] = r[i] + (r[i + 1] - r[i]) * f;
      ringW = (ringW + 1) % RING;
    }
    ringPos -= n - 1;
  }
  audioPeak = Math.max(audioPeak, peak); audioPeak5 = Math.max(audioPeak5, peak); audioMsgs++;
}

// ---- input -----------------------------------------------------------------------------

function send(u8) { if (ws && ws.readyState === 1) ws.send(u8); }
// problems go to the PC window too (the iPad has no developer console at hand)
// to the PC log only (the 5 s report shows it), nothing on the iPad screen
function note(t) {
  errors.push(String(t).slice(0, 120)); if (errors.length > 3) errors.shift();
  try { if (ws && ws.readyState === 1) ws.send(String(t).slice(0, 500)); } catch (e) {}
}
function report(t) {
  errors.push(String(t).slice(0, 120)); if (errors.length > 3) errors.shift();
  try { if (ws && ws.readyState === 1) ws.send(String(t).slice(0, 500)); } catch (e) {}
  banner(String(t));
}

// screen point -> 0..65535 on the PC screen (the picture is letterboxed with object-fit: contain)
function norm(x, y) {
  if (!cfg) return null;
  const st = $("stage"), W = st.clientWidth || window.innerWidth, H = st.clientHeight || window.innerHeight;
  let w = W, h = H; // stretch: the picture is exactly the screen
  if (fit !== "stretch") {
    const s = fit === "fill" ? Math.max(W / cfg.w, H / cfg.h) : Math.min(W / cfg.w, H / cfg.h);
    w = cfg.w * s; h = cfg.h * s;
  }
  const ox = (W - w) / 2, oy = (H - h) / 2;
  const nx = Math.round((x - ox) / w * 65535), ny = Math.round((y - oy) / h * 65535);
  return [Math.max(0, Math.min(65535, nx)), Math.max(0, Math.min(65535, ny))];
}
function move(p) { if (p) send(new Uint8Array([1, p[0] >> 8, p[0] & 255, p[1] >> 8, p[1] & 255])); }
function button(btn, down, p) { if (p) send(new Uint8Array([2, btn, down ? 1 : 0, p[0] >> 8, p[0] & 255, p[1] >> 8, p[1] & 255])); }
function click(btn, p) { button(btn, true, p); button(btn, false, p); }
function wheel(dy, dx) {
  const m = new DataView(new ArrayBuffer(5)); m.setUint8(0, 3); m.setInt16(1, dy); m.setInt16(3, dx); send(new Uint8Array(m.buffer));
}
function key(vk) { send(new Uint8Array([5, vk])); }
function text(t) { const b = new TextEncoder().encode(t); const m = new Uint8Array(b.length + 1); m[0] = 4; m.set(b, 1); send(m); }

const stage = $("stage");
let one = null, two = null, longTimer = 0;

stage.addEventListener("touchstart", e => {
  if (e.target.closest("#tools")) return;
  e.preventDefault();
  const t = e.touches;
  if (t.length === 1) {
    const p = norm(t[0].clientX, t[0].clientY);
    one = { x: t[0].clientX, y: t[0].clientY, p, drag: false, done: false };
    move(p);
    longTimer = setTimeout(() => { if (one && !one.drag) { click(1, one.p); one.done = true; } }, 550);
  } else if (t.length === 2) {
    clearTimeout(longTimer);
    if (one && one.drag) button(0, false, one.p);
    one = null;
    two = { y: (t[0].clientY + t[1].clientY) / 2, x: (t[0].clientX + t[1].clientX) / 2, moved: 0, at: Date.now(),
            p: norm((t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2), acc: 0, accX: 0 };
  }
}, { passive: false });

stage.addEventListener("touchmove", e => {
  if (e.target.closest("#tools")) return;
  e.preventDefault();
  const t = e.touches;
  if (one && t.length === 1) {
    const dx = t[0].clientX - one.x, dy = t[0].clientY - one.y;
    if (!one.drag && !one.done && dx * dx + dy * dy > 100) { clearTimeout(longTimer); one.drag = true; button(0, true, one.p); }
    if (one.drag) { one.p = norm(t[0].clientX, t[0].clientY); move(one.p); }
  } else if (two && t.length === 2) {
    const y = (t[0].clientY + t[1].clientY) / 2, x = (t[0].clientX + t[1].clientX) / 2;
    two.acc += (y - two.y) * 4; two.accX += (two.x - x) * 4; two.moved += Math.abs(y - two.y) + Math.abs(x - two.x);
    two.y = y; two.x = x;
    const sy = Math.trunc(two.acc / 40) * 40, sx = Math.trunc(two.accX / 40) * 40;
    if (sy || sx) { wheel(sy, sx); two.acc -= sy; two.accX -= sx; }
  }
}, { passive: false });

stage.addEventListener("touchend", e => {
  if (e.target.closest("#tools")) return;
  e.preventDefault();
  clearTimeout(longTimer);
  if (one && e.touches.length === 0) {
    if (one.drag) button(0, false, one.p);
    else if (!one.done) click(0, one.p);
    one = null;
  }
  if (two && e.touches.length === 0) {
    if (two.moved < 12 && Date.now() - two.at < 300) click(1, two.p); // two-finger tap
    two = null;
  }
}, { passive: false });

// a mouse or trackpad (Magic Keyboard, or a desktop browser)
let mouseDown = false;
stage.addEventListener("mousedown", e => { if (e.target.closest("#tools")) return; mouseDown = true; button(e.button === 2 ? 1 : e.button === 1 ? 2 : 0, true, norm(e.clientX, e.clientY)); });
stage.addEventListener("mouseup", e => { if (e.target.closest("#tools")) return; mouseDown = false; button(e.button === 2 ? 1 : e.button === 1 ? 2 : 0, false, norm(e.clientX, e.clientY)); });
stage.addEventListener("mousemove", e => { if (!e.target.closest("#tools")) move(norm(e.clientX, e.clientY)); });
stage.addEventListener("contextmenu", e => e.preventDefault());
stage.addEventListener("wheel", e => { e.preventDefault(); wheel(Math.max(-1200, Math.min(1200, Math.round(-e.deltaY * 1.2))), Math.max(-1200, Math.min(1200, Math.round(e.deltaX * 1.2)))); }, { passive: false });

// keyboard: a hidden text box that holds one space, so Backspace always has something to delete
const kbd = $("kbd");
const KEYS = { Backspace: 8, Tab: 9, Enter: 13, Escape: 27, PageUp: 33, PageDown: 34, End: 35, Home: 36,
               ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Delete: 46 };
function resetKbd() { kbd.value = " "; kbd.setSelectionRange(1, 1); }
$("b-kbd").addEventListener("click", () => { if (document.activeElement === kbd) kbd.blur(); else { resetKbd(); kbd.focus(); } });
kbd.addEventListener("keydown", e => { if (KEYS[e.key]) { e.preventDefault(); key(KEYS[e.key]); } });

// A keyboard of its own (a Mac's or a PC's, or a Magic Keyboard / Bluetooth keyboard on an iPad)
// types straight to the PC, no ⌨ button needed (on an iPad it stays for the on-screen one): editing
// and navigation keys by key code, characters as text (also Option / AltGr letters such as ą).
// ⌘ and Ctrl shortcuts stay with this computer (⌘Q, ⌘Tab, copy and paste here); the PC would
// refuse them anyway (only editing and navigation keys are accepted there).
function physicalKey(e) {
  if (e.isComposing || e.metaKey || e.ctrlKey) return null;
  if (KEYS[e.key]) return { vk: KEYS[e.key] };
  if (e.key && e.key.length === 1) return { text: e.key };
  return null;
}
document.addEventListener("keydown", e => {
  // while the hidden text box has the focus (the ⌨ button), its own handlers type
  if (!started || !cfg || !cfg.control || document.activeElement === kbd) return;
  const a = physicalKey(e);
  if (!a) return;
  e.preventDefault(); // Tab must not move the focus, Space must not scroll
  if (a.vk) key(a.vk); else text(a.text);
});
kbd.addEventListener("input", e => {
  if (e.inputType === "deleteContentBackward") key(8);
  else if (e.inputType === "insertLineBreak" || e.inputType === "insertParagraph") key(13);
  else if (e.data) text(e.data);
  resetKbd();
});
// "Smoother" on/off; on by default (the home Wi-Fi often stalls for 100+ ms), remembered
let smooth = true;
try { if (localStorage.getItem("smooth") === "0") smooth = false; } catch (e) {}
$("b-smooth").style.opacity = smooth ? "1" : "0.55";
$("b-smooth").addEventListener("click", () => {
  smooth = !smooth;
  applyJitter();
  try { localStorage.setItem("smooth", smooth ? "1" : "0"); } catch (e) {}
  $("b-smooth").style.opacity = smooth ? "1" : "0.55";
  jitterClear();
  const msg = smooth ? T.smoothOn : T.smoothOff;
  banner(msg); setTimeout(() => { if ($("banner").textContent === msg) banner(""); }, 2000);
});

// picture size, like the TV app: fill (no bars, edges cut) / stretch / fit (bars); remembered
const FITS = ["stretch", "contain", "fill"];
let fit = "stretch"; // the whole PC screen on the whole iPad screen, nothing cut off
// "fitMode", not "fit": the old key held "fill" from when that was the default
try { if (FITS.indexOf(localStorage.getItem("fitMode")) >= 0) fit = localStorage.getItem("fitMode"); } catch (e) {}
function applyFit() {
  const f = fit === "stretch" ? "fill" : fit === "fill" ? "cover" : "contain";
  video.style.objectFit = f; canvas.style.objectFit = f;
}
applyFit();
$("b-fit").addEventListener("click", () => {
  fit = FITS[(FITS.indexOf(fit) + 1) % FITS.length];
  applyFit();
  try { localStorage.setItem("fitMode", fit); } catch (e) {}
  banner(T.fits[fit]); setTimeout(() => { if ($("banner").textContent === T.fits[fit]) banner(""); }, 1500);
});
$("b-info").addEventListener("click", () => { const s = $("status"); s.style.display = s.style.display === "block" ? "none" : "block"; });
</script>
</body>
</html>
