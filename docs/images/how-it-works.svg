<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f6f8fa; stroke: #8250df; stroke-width: 1.5; }
    .title { fill: #1f2328; font-size: 19px; font-weight: 600; }
    .sub { fill: #59636e; font-size: 13px; }
    .line { stroke: #6e7781; stroke-width: 1.6; fill: none; }
    .lab { fill: #1f2328; font-size: 13px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .head { fill: #6e7781; }
    .note { fill: #59636e; font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #a371f7; }
      .title { fill: #e6edf3; }
      .sub, .note { fill: #9198a1; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .lab { fill: #e6edf3; stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- senders -->
  <rect class="box" x="20" y="40" width="240" height="70" rx="14"/>
  <text class="title" x="40" y="70">Phone</text>
  <text class="sub" x="40" y="93">CastLink · screen + sound</text>

  <rect class="box" x="20" y="230" width="240" height="70" rx="14"/>
  <text class="title" x="40" y="260">PC</text>
  <text class="sub" x="40" y="283">CastLink · screen + sound</text>

  <!-- receivers -->
  <rect class="box" x="600" y="20" width="240" height="70" rx="14"/>
  <text class="title" x="620" y="50">TV</text>
  <text class="sub" x="620" y="73">CastLink · mouse, keyboard, remote</text>

  <rect class="box" x="600" y="150" width="240" height="70" rx="14"/>
  <text class="title" x="620" y="180">Phone</text>
  <text class="sub" x="620" y="203">CastLink · touch</text>

  <rect class="box" x="600" y="280" width="240" height="70" rx="14"/>
  <text class="title" x="620" y="310">iPad / Mac</text>
  <text class="sub" x="620" y="333">Safari · touch, mouse, keyboard</text>

  <!-- picture + sound -->
  <path class="line" d="M260,70 L598,52" marker-end="url(#a)"/>
  <path class="line" d="M260,245 L598,72" marker-end="url(#a)"/>
  <path class="line" d="M260,265 L598,188" marker-end="url(#a)"/>
  <path class="line" d="M260,285 L598,312" marker-end="url(#a)"/>

  <text class="lab" x="430" y="52" text-anchor="middle">H.264 + PCM, encrypted</text>
  <text class="lab" x="400" y="165" text-anchor="middle">H.264 + PCM, encrypted</text>
  <text class="lab" x="480" y="226" text-anchor="middle">Wi-Fi or USB cable</text>
  <text class="lab" x="430" y="312" text-anchor="middle">WebRTC (UDP)</text>

  <text class="note" x="20" y="368">Arrows: picture and sound. Each receiver sends its mouse, keyboard or touch back to the PC.</text>
</svg>
